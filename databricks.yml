# This is a Declarative Automation Bundle definition for phi_dbr_demo.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: phi_dbr_demo
  uuid: 54084c92-0ce9-4a92-aeed-7f839f4a94d7

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-4355ce94-33d4.cloud.databricks.com?w=415678354416856
    variables:
      catalog: phi_default_catalog
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-4355ce94-33d4.cloud.databricks.com?w=415678354416856
      # We explicitly deploy to /Workspace/Users/nguyenhongphi2807@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/nguyenhongphi2807@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: phi_default_catalog
      schema: prod
    permissions:
      - user_name: nguyenhongphi2807@gmail.com
        level: CAN_MANAGE
